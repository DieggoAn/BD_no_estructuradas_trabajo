version: '3.8'

services:
  comerciotech-nosql:
    image: mongo:7.0
    container_name: comerciotech_nosql
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-rbac.js:/docker-entrypoint-initdb.d/init-rbac.js:ro
    command: [ "--auth" ]

  comerciotech-sql:
    image: mysql:8.0
    container_name: comerciotech_sql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=AdminComercio2026*
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/initmysql.sql:/docker-entrypoint-initdb.d/initmysql.sql:ro

  comerciotech_app:
    build: .
    container_name: comerciotech_app
    depends_on:
      - comerciotech-nosql
      - comerciotech-sql
    restart: "no"
    stdin_open: true
    tty: true
volumes:
  mongo_data:
  mysql_data: